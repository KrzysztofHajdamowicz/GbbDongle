# Development variant for the Waveshare ESP32-S3-POE-ETH-8DI-8DO (WiFi):
# verbose logging, joins your WiFi from secrets.yaml (see common/wifi-dev.yaml).
# Build & flash: uv run esphome run firmware/gbbdongle-8di8do-wifi-dev.yaml

substitutions:
  device_name: gbbdongle-8di8do-wifi-dev
  friendly_name: GbbDongle 8DI8DO WiFi Dev
  # Point dev devices at the per-board manifest: the legacy shared manifest's
  # ESP32-S3 entry is the RS485-CAN board's firmware — wrong board.
  update_manifest_url: https://krzysztofhajdamowicz.github.io/GbbDongle/firmware/update-manifest-8di8do-wifi.json

packages:
  base: !include common/base.yaml
  wifi: !include common/wifi.yaml
  board: !include boards/waveshare-esp32-s3-poe-eth-8di-8do.yaml
  board_wifi: !include boards/waveshare-esp32-s3-poe-eth-8di-8do-wifi.yaml
  dev: !include common/dev.yaml
  wifi_dev: !include common/wifi-dev.yaml
