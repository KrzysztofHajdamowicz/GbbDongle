# Ethernet transport overlay for the Waveshare ESP32-S3-POE-ETH-8DI-8DO.
# Device yamls using this file must NOT include common/wifi.yaml
# (ethernet: conflicts with wifi:). PoE (802.3af) is pure hardware —
# invisible to the firmware.

# W5500 over SPI. The ethernet component drives its own SPI host (spi2 on
# ESP32-S3) — do not add an spi: block for these pins.
ethernet:
  type: W5500
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  cs_pin: GPIO16
  interrupt_pin: GPIO12
  reset_pin: GPIO39

gbb_dongle:
  # Ethernet-only variant: no WiFi signal sensors; ClientInfo reports "Ethernet".
  ip_address_id: ip_address_text

text_sensor:
  - platform: ethernet_info
    ip_address:
      id: ip_address_text
      name: IP Address
      entity_category: diagnostic
