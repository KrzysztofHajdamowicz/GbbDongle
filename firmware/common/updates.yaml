# Self-update package for the published firmware lines (factory and
# HA-compatible): pulls new releases from the update manifest on GitHub
# Pages, served at gbbdongle.hajdamowicz.info. Images up to v2.1.0 poll the
# krzysztofhajdamowicz.github.io/GbbDongle URLs instead and reach the same
# files through GitHub's 301 to the custom domain (http_request follows
# redirects and resolves the relative OTA path against that original URL),
# so the custom domain has to stay configured on this repo's Pages site.
# Deliberately NOT part of the import targets (firmware/<config>.yaml)
# — an adopted device is compiled by the user's ESPHome dashboard and must
# not overwrite that build with images from our releases.

http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    state_topic:
    source: ${update_manifest_url}
    update_interval: 6h
    # Fires once per detected release (on the NO_UPDATE -> AVAILABLE
    # transition), not on every 6h poll. A reboot during the spread delay is
    # harmless: the boot-time check re-detects the release and re-arms the
    # script with a fresh delay.
    on_update_available:
      then:
        - script.execute: auto_install_firmware

script:
  # Spreads fleet installs over 0-5h so devices don't all flash at the same
  # moment. The update.is_available guard skips the install if the manifest
  # was rolled back while we were waiting.
  - id: auto_install_firmware
    mode: restart
    then:
      - delay: !lambda 'return random_uint32() % (5UL * 60UL * 60UL * 1000UL);'
      - if:
          condition:
            update.is_available: firmware_update
          then:
            - update.perform: firmware_update
