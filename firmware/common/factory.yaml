# Factory line overlay: the closed, standalone GbbDongle product.
# - No Home Assistant native API at all (api: !remove strips it from base).
# - Web dashboard behind HTTP basic auth (admin / ${admin_password}, default
#   set by the *-factory.yaml variants) with a runtime-changeable password
#   that also guards esphome-OTA uploads. Factory Reset restores defaults.
# - Self-updates from GitHub Pages (common/updates.yaml).

packages:
  updates: !include updates.yaml

api: !remove

web_server_base:
  id: web_base

web_server:
  auth:
    # Digest keeps the password out of the (plain-HTTP) request headers;
    # it also becomes the ESPHome default in 2027.1.
    type: digest
    username: admin
    password: ${admin_password}

text:
  - platform: template
    id: admin_password_txt
    name: Admin Password
    icon: mdi:form-textbox-password
    entity_category: config
    mode: password
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 64
    # An empty state_topic marks the entity internal to MQTT — the admin
    # password is never published to the (GbbOptimizer) broker.
    state_topic:
    # Fires on boot with the NVS-restored value too, so a changed password
    # survives restarts. Empty value restores the compiled-in default.
    on_value:
      - lambda: |-
          if (!x.empty()) {
            // web_server_base stores the raw pointer without copying, so it
            // must point at storage that outlives the lambda: the text
            // component's state member, refreshed here on every change.
            id(web_base)->set_auth_password(id(admin_password_txt).state.c_str());
            id(ota_esphome)->set_auth_password(x);
          } else {
            // The web credentials pointer aliases the state buffer, so a
            // cleared field would silently turn the effective web password
            // into "" until reboot; set the default explicitly instead, for
            // both auth paths, matching what a reboot restores.
            id(web_base)->set_auth_password("${admin_password}");
            id(ota_esphome)->set_auth_password("${admin_password}");
          }
