# Board-agnostic, transport-agnostic configuration shared by all GbbDongle
# firmware variants. Hardware specifics (esp32/psram, UART pins, RS485
# direction control, BLE provisioning, ethernet) live in
# firmware/boards/*.yaml; WiFi connectivity lives in common/wifi.yaml. A
# device yaml combines this file with exactly one board file (plus wifi.yaml
# for WiFi boards) via `packages:`.

substitutions:
  device_name: gbbdongle
  friendly_name: GbbDongle
  version: 0.0.0-dev
  log_level: DEBUG
  # Empty = OTA uploads without authentication (HA-compatible/adopted/dev
  # builds). The factory variants override this with "admin" and rotate it at
  # runtime via the Admin Password entity (common/factory.yaml).
  admin_password: ""

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  project:
    name: krzysztofhajdamowicz.gbbdongle
    version: ${version}

external_components:
  - source:
      type: local
      path: ../components

logger:
  level: ${log_level}

# Keyless encryption: the device boots unprovisioned; the first API client
# (Home Assistant) generates a unique key that is persisted in NVS, after
# which only that key is accepted (a factory reset clears it). The factory
# variants strip the whole api: block with `api: !remove`.
api:
  reboot_timeout: 0s
  encryption:

web_server:
  version: 3

safe_mode:

# An empty password compiles the auth path but skips the challenge, so the
# factory variants can both set a default via ${admin_password} and rotate it
# at runtime through set_auth_password().
ota:
  - platform: esphome
    id: ota_esphome
    password: ${admin_password}
  - platform: web_server

# TX/RX pins come from the board file.
uart:
  id: rs485_uart
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

# The broker/credentials below are placeholders: GbbDongle applies the
# runtime-configured values (entities below, persisted in NVS) before calling
# enable(). enable_on_boot must stay false.
mqtt:
  id: gbb_mqtt
  broker: 127.0.0.1
  port: 8883
  enable_on_boot: false
  discovery: false
  reboot_timeout: 0s
  birth_message:
  will_message:
  shutdown_message:
  log_topic:

# flow_control_pin (boards with manual RS485 direction control) and
# log_buffer_size (boards without PSRAM) are set in the board file.
gbb_dongle:
  id: gbb
  uart_id: rs485_uart
  mqtt_id: gbb_mqtt
  version: ${version}
  environment: GbbDongle
  client_environment: GbbDongle/${device_name}
  uptime_text_id: uptime_text
  mqtt_host_id: cfg_mqtt_host
  mqtt_port_id: cfg_mqtt_port
  plant_id_id: cfg_plant_id
  plant_token_id: cfg_plant_token
  cloud_enabled_id: cfg_cloud_enabled
  tls_enabled_id: cfg_tls_enabled
  tls_skip_cn_check_id: cfg_tls_skip_cn_check
  baud_rate_id: cfg_baud_rate
  parity_id: cfg_parity
