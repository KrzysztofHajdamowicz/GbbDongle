  #    openssl s_client -connect <host>:8883 -showcerts).
  # 2. Certum Trusted Network CA — root of the pre-2026-07-27 chain (leaf <-
  #    Certum Domain Validation CA SHA2 <- this root); kept while brokers may
  #    still serve certificates from the old chain.
