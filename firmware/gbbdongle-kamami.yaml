# GbbDongle for the Kamami KAmod ESP32 ETH+PoE + RS485 ISO HAT.
# Dashboard-adoption import target (see gbbdongle.yaml for details);
# published images are built from the -factory and -ha variants.
# Build: uv run esphome compile firmware/gbbdongle-kamami.yaml

substitutions:
  device_name: gbbdongle-kamami

packages:
  base: !include common/base.yaml
  board: !include boards/kamami-esp32-eth-poe.yaml
