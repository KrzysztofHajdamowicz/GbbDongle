# Development variant for the Waveshare ESP32-S3-POE-ETH-8DI-8DO (Ethernet):
# verbose logging. Networking comes from the Ethernet jack (DHCP) — no
# secrets.yaml needed.
# Build & flash: uv run esphome run firmware/gbbdongle-8di8do-eth-dev.yaml

substitutions:
  device_name: gbbdongle-8di8do-eth-dev
  friendly_name: GbbDongle 8DI8DO Ethernet Dev

packages:
  base: !include common/base.yaml
  board: !include boards/waveshare-esp32-s3-poe-eth-8di-8do.yaml
  board_eth: !include boards/waveshare-esp32-s3-poe-eth-8di-8do-eth.yaml
  dev: !include common/dev.yaml
