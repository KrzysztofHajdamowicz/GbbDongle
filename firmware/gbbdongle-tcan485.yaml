# GbbDongle for the LilyGo T-CAN485.
# Dashboard-adoption import target (see gbbdongle.yaml for details);
# published images are built from the -factory and -ha variants.
# Build: uv run esphome compile firmware/gbbdongle-tcan485.yaml

substitutions:
  device_name: gbbdongle-tcan485

packages:
  base: !include common/base.yaml
  wifi: !include common/wifi.yaml
  board: !include boards/lilygo-t-can485.yaml
