# Published Home Assistant-compatible image for gbbdongle: native API enabled
# (encryption key provisioned on first connection), broadcasts the ESPHome
# dashboard adoption URL. No passwords — after adoption the configuration is
# owned by the user (Bring Your Own Support).
# Build: uv run esphome -s version 1.2.3 compile firmware/gbbdongle-ha.yaml

substitutions:
  update_manifest_url: https://krzysztofhajdamowicz.github.io/GbbDongle/firmware/update-manifest-gbbdongle-ha.json

packages:
  device: !include gbbdongle.yaml
  ha: !include common/ha.yaml
