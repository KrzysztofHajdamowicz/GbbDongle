# GbbDongle for the Waveshare ESP32-S3-RS485-CAN.
# This file is the dashboard-adoption import target: the ESPHome dashboard
# pulls it via github:// when adopting a device running the HA-compatible
# image. Published images are built from gbbdongle-factory.yaml and
# gbbdongle-ha.yaml.
# Build: uv run esphome compile firmware/gbbdongle.yaml

# device_name stays at the base default (gbbdongle) so artifact names keep
# resolving for update manifests already in the field.

packages:
  base: !include common/base.yaml
  wifi: !include common/wifi.yaml
  board: !include boards/waveshare-esp32-s3-rs485-can.yaml
