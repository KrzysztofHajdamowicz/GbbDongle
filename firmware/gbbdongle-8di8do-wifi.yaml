# Release firmware for GbbDongle (Waveshare ESP32-S3-POE-ETH-8DI-8DO), WiFi
# variant. Build: uv run esphome compile firmware/gbbdongle-8di8do-wifi.yaml
# CI overrides the version: uv run esphome -s version 1.2.3 compile ...

substitutions:
  device_name: gbbdongle-8di8do-wifi
  friendly_name: GbbDongle (Waveshare ESP32-S3-POE-ETH-8DI-8DO, WiFi)
  update_manifest_url: https://krzysztofhajdamowicz.github.io/GbbDongle/firmware/update-manifest-8di8do-wifi.json

packages:
  base: !include common/base.yaml
  wifi: !include common/wifi.yaml
  board: !include boards/waveshare-esp32-s3-poe-eth-8di-8do.yaml
  board_wifi: !include boards/waveshare-esp32-s3-poe-eth-8di-8do-wifi.yaml
