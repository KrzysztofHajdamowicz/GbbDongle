# Published Home Assistant-compatible image for gbbdongle-8di8do-eth: native API enabled
# (encryption key provisioned on first connection), broadcasts the ESPHome
# dashboard adoption URL. No passwords — after adoption the configuration is
# owned by the user (Bring Your Own Support).
# Build: uv run esphome -s version 1.2.3 compile firmware/gbbdongle-8di8do-eth-ha.yaml

substitutions:
  update_manifest_url: https://krzysztofhajdamowicz.github.io/GbbDongle/firmware/update-manifest-8di8do-eth-ha.json

packages:
  device: !include gbbdongle-8di8do-eth.yaml
  ha: !include common/ha.yaml
