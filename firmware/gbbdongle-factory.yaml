# Published Factory Image for gbbdongle: standalone GbbDongle product, no Home
# Assistant API, web dashboard and OTA uploads behind the admin password
# (default admin/admin, changeable via the Admin Password entity).
# Build: uv run esphome -s version 1.2.3 compile firmware/gbbdongle-factory.yaml

substitutions:
  admin_password: admin
  update_manifest_url: https://krzysztofhajdamowicz.github.io/GbbDongle/firmware/update-manifest-gbbdongle.json

packages:
  device: !include gbbdongle.yaml
  factory: !include common/factory.yaml
