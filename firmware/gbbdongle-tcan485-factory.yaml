# Published Factory Image for gbbdongle-tcan485: standalone GbbDongle product, no Home
# Assistant API, web dashboard and OTA uploads behind the admin password
# (default admin/admin, changeable via the Admin Password entity).
# Build: uv run esphome -s version 1.2.3 compile firmware/gbbdongle-tcan485-factory.yaml

substitutions:
  admin_password: admin
  update_manifest_url: https://krzysztofhajdamowicz.github.io/GbbDongle/firmware/update-manifest-tcan485.json

packages:
  device: !include gbbdongle-tcan485.yaml
  factory: !include common/factory.yaml
