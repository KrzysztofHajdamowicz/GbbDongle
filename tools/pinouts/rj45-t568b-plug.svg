<!--
  RJ45 (8P8C) plug wired to T568B, seen from the contact side (latch at the back).
  Orientation as in the source drawing: cable to the left, contacts to the right,
  pin 1 at the top. tools/pinouts/gen_svg.py gives it a half turn for the site
  convention (pins on the left, cable to the right, pin 1 at the bottom).

  Based on "RJ-45 TIA-568B Right.svg" by Miha Ulanov, Wikimedia Commons, public domain:
  https://commons.wikimedia.org/wiki/File:RJ-45_TIA-568B_Right.svg
  Differences from the source: no text labels or editor metadata, the contact
  rectangles hidden under identical ones are gone, the view box is cropped to the
  artwork, the cable jacket is grey, the plug body has a light tint and the striped
  wires have a white base under their colour patches.

  Units are millimetres of the source drawing. Contact centres: pin 1 at y = 5.993,
  one pin every 3.296 down to pin 8.
-->
