<footer class="site-footer">
  <div class="wrap footer-row">
    <div>
      <a class="brand brand-footer" href="{{ .Site.Home.RelPermalink }}">{{ partial "logo.svg.html" . }}<span>GbbDongle</span></a>
      <p class="muted small">{{ i18n "footer_tagline" }}</p>
    </div>
    <nav class="footer-links">
      {{ range .Site.Menus.main }}<a href="{{ .URL | relLangURL }}">{{ .Name }}</a>{{ end }}
      <a href="{{ .Site.Params.repo }}">{{ i18n "source" }}</a>
      {{ with .Site.Params.discord }}<a href="{{ . }}">Discord</a>{{ end }}
    </nav>
  </div>
  <div class="wrap small muted footer-credits">
    {{ i18n "photos_credit" }}:
    Waveshare (<a href="https://www.waveshare.com/esp32-s3-rs485-can.htm">RS485-CAN</a>,
    <a href="https://www.waveshare.com/esp32-s3-poe-eth-8di-8do.htm">8DI-8DO</a>),
    <a href="https://lilygo.cc/products/t-can485">LilyGo</a>,
    <a href="https://wiki.kamamilabs.com/index.php?title=KAmod_ESP32_ETH_POE">Kamami</a>.
  </div>
</footer>
