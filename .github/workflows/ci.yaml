name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists a PR's files via the API

# Which jobs run depends on the files a change touches (job "changes"):
#   firmware: import-target validation + the compile matrix
#   website:  Hugo build of the product site (same action pages.yaml deploys
#             with), uploaded as an artifact for preview
# Skipped jobs never block a merge: branch protection requires only the
# "CI result" job, which always runs and fails only if a job that ran failed.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      # Pull requests are diffed through the API; pushes need the history.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            firmware:
              - "components/**"
              - "firmware/**"
              - "tests/**"
              - "tools/**"
              # esphome and its toolchain are pinned here (Dependabot bumps)
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
              - ".github/workflows/ci.yaml"
              - ".github/workflows/release.yaml"
            website:
              - "website/**"
              # FAQ pages render docs/faq.md (EN) and docs/faq.pl.md (PL)
              - "docs/faq*.md"
              - "tools/site/**"
              - ".github/actions/build-site/**"
              - ".github/workflows/ci.yaml"
              - ".github/workflows/pages.yaml"

  # The import targets (firmware/<config>.yaml) are what the ESPHome
  # dashboard pulls in during adoption — validate them standalone even
  # though the variant builds below include them as packages.
  validate-import-targets:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Validate import targets
        run: |
          for config in gbbdongle gbbdongle-tcan485 gbbdongle-kamami gbbdongle-8di8do-wifi gbbdongle-8di8do-eth; do
            uv run esphome -s external_components_source ../components config "firmware/${config}.yaml" > /dev/null
          done

  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both published lines per board: -factory (no api, web auth) and
        # -ha (api + dashboard_import) compile different code paths.
        config:
          - gbbdongle-factory
          - gbbdongle-ha
          - gbbdongle-tcan485-factory
          - gbbdongle-tcan485-ha
          - gbbdongle-kamami-factory
          - gbbdongle-kamami-ha
          - gbbdongle-8di8do-wifi-factory
          - gbbdongle-8di8do-wifi-ha
          - gbbdongle-8di8do-eth-factory
          - gbbdongle-8di8do-eth-ha
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache PlatformIO and ESPHome build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            firmware/.esphome
          # "=" terminates the config name so restore-keys prefix matching
          # cannot cross variants ("gbbdongle" is a prefix of all the others).
          key: pio-${{ runner.os }}-${{ matrix.config }}=${{ hashFiles('uv.lock', 'firmware/**/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.config }}=

      - name: Validate configuration
        run: uv run esphome -s external_components_source ../components config firmware/${{ matrix.config }}.yaml

      # The mqtt: client is the cloud link; no entity may publish or accept
      # commands on it (see the mqtt: block in firmware/common/base.yaml).
      - name: Check no entity is exposed over MQTT
        run: uv run python tools/check_mqtt_exposure.py firmware/${{ matrix.config }}.yaml

      - name: Compile firmware
        run: uv run esphome -s external_components_source ../components compile firmware/${{ matrix.config }}.yaml

      # OTA images for testers: flashable onto an already-running board via
      # the device web UI or the ESPHome dashboard, no Pages/manifest churn.
      # Same naming scheme as release.yaml so artifacts match release names.
      - name: Collect OTA image
        if: github.event_name == 'pull_request'
        run: |
          CONFIG="${{ matrix.config }}"
          BASE="${CONFIG%-factory}"
          BASE="${BASE%-ha}"
          BUILD_DIR="firmware/.esphome/build/${BASE}/build"
          case "$CONFIG" in
            *-factory) OUT="$BASE" ;;
            *-ha)      OUT="${BASE}-ha" ;;
          esac
          mkdir -p dist
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${OUT}.ota.bin"

      - name: Upload OTA image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ota-${{ matrix.config }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Builds what pages.yaml would deploy (site + latest release's firmware
  # and manifests) but never deploys; the artifact is a static preview:
  # unzip it and serve the directory, e.g. `python3 -m http.server`.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-site

      - name: Upload site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: site/
          if-no-files-found: error
          retention-days: 7

  # The one check to require in branch protection. A job skipped by the
  # path filter counts as passed; a failed or cancelled one fails this.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, validate-import-targets, build, website]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
