name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists a PR's files via the API

# Which jobs run depends on the files a change touches (job "changes"):
#   firmware: import-target validation + the compile matrix
#   website:  Hugo build of the product site (same action pages.yaml deploys
#             with), uploaded as an artifact for preview
# Skipped jobs never block a merge: branch protection requires only the
# "CI result" job, which always runs and fails only if a job that ran failed.

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      website: ${{ steps.filter.outputs.website }}
      preview: ${{ steps.preview.outputs.enabled }}
    steps:
      # Secrets cannot gate a job directly; fork and Dependabot PRs get none,
      # so they skip the Cloudflare preview and keep the artifact.
      - id: preview
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "enabled=${CF_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      # Pull requests are diffed through the API; pushes need the history.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            firmware:
              - "components/**"
              - "firmware/**"
              - "tests/**"
              - "tools/**"
              # esphome and its toolchain are pinned here (Dependabot bumps)
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
              - ".github/workflows/ci.yaml"
              - ".github/workflows/release.yaml"
            website:
              - "website/**"
              # FAQ pages render docs/faq.md (EN) and docs/faq.pl.md (PL)
              - "docs/faq*.md"
              - "tools/site/**"
              - ".github/actions/build-site/**"
              - ".github/workflows/ci.yaml"
              - ".github/workflows/pages.yaml"

  # The import targets (firmware/<config>.yaml) are what the ESPHome
  # dashboard pulls in during adoption — validate them standalone even
  # though the variant builds below include them as packages.
  validate-import-targets:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Validate import targets
        run: |
          for config in gbbdongle gbbdongle-tcan485 gbbdongle-kamami gbbdongle-8di8do-wifi gbbdongle-8di8do-eth; do
            uv run esphome -s external_components_source ../components config "firmware/${config}.yaml" > /dev/null
          done

  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both published lines per board: -factory (no api, web auth) and
        # -ha (api + dashboard_import) compile different code paths.
        config:
          - gbbdongle-factory
          - gbbdongle-ha
          - gbbdongle-tcan485-factory
          - gbbdongle-tcan485-ha
          - gbbdongle-kamami-factory
          - gbbdongle-kamami-ha
          - gbbdongle-8di8do-wifi-factory
          - gbbdongle-8di8do-wifi-ha
          - gbbdongle-8di8do-eth-factory
          - gbbdongle-8di8do-eth-ha
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache PlatformIO and ESPHome build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            firmware/.esphome
          # "=" terminates the config name so restore-keys prefix matching
          # cannot cross variants ("gbbdongle" is a prefix of all the others).
          key: pio-${{ runner.os }}-${{ matrix.config }}=${{ hashFiles('uv.lock', 'firmware/**/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.config }}=

      - name: Validate configuration
        run: uv run esphome -s external_components_source ../components config firmware/${{ matrix.config }}.yaml

      # The mqtt: client is the cloud link; no entity may publish or accept
      # commands on it (see the mqtt: block in firmware/common/base.yaml).
      - name: Check no entity is exposed over MQTT
        run: uv run python tools/check_mqtt_exposure.py firmware/${{ matrix.config }}.yaml

      - name: Compile firmware
        run: uv run esphome -s external_components_source ../components compile firmware/${{ matrix.config }}.yaml

      # OTA images for testers: flashable onto an already-running board via
      # the device web UI or the ESPHome dashboard, no Pages/manifest churn.
      # Same naming scheme as release.yaml so artifacts match release names.
      - name: Collect OTA image
        if: github.event_name == 'pull_request'
        run: |
          CONFIG="${{ matrix.config }}"
          BASE="${CONFIG%-factory}"
          BASE="${BASE%-ha}"
          BUILD_DIR="firmware/.esphome/build/${BASE}/build"
          case "$CONFIG" in
            *-factory) OUT="$BASE" ;;
            *-ha)      OUT="${BASE}-ha" ;;
          esac
          mkdir -p dist
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${OUT}.ota.bin"

      - name: Upload OTA image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ota-${{ matrix.config }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Builds what pages.yaml would deploy (site + latest release's firmware
  # and manifests) but never deploys; the artifact is a static preview:
  # unzip it and serve the directory, e.g. `python3 -m http.server`.
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-site

      - name: Upload site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: site/
          if-no-files-found: error
          retention-days: 7

  # Per-PR preview on Cloudflare Pages: project gbbdongle-preview, branch
  # alias pr-<number>, linked from the PR as the site-preview deployment.
  # Production stays on GitHub Pages (pages.yaml); nothing here touches it.
  # Not part of "CI result", so missing secrets or a Cloudflare outage never
  # block a merge. Needs repository secrets CLOUDFLARE_API_TOKEN (Account >
  # Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID; the project is created
  # on first use.
  preview:
    needs: [changes, website]
    if: github.event_name == 'pull_request' && needs.changes.outputs.preview == 'true'
    runs-on: ubuntu-latest
    environment:
      name: site-preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: gbbdongle-preview
      BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      # The pages.dev subdomain gets a random suffix when the project name is
      # taken, so read it from the API instead of assuming it.
      - name: Resolve preview URL
        id: project
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          RESP=$(curl -sS -H "$AUTH" "${API}/${PROJECT}")
          if [ "$(jq -r .success <<<"$RESP")" != true ]; then
            RESP=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"name\":\"${PROJECT}\",\"production_branch\":\"main\"}" "$API")
          fi
          if [ "$(jq -r .success <<<"$RESP")" != true ]; then
            jq .errors <<<"$RESP" >&2
            exit 1
          fi
          echo "base_url=https://${BRANCH}.$(jq -r .result.subdomain <<<"$RESP")" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-site
        with:
          base-url: ${{ steps.project.outputs.base_url }}

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.153.0"
          command: >-
            pages deploy site
            --project-name=${{ env.PROJECT }}
            --branch=${{ env.BRANCH }}
            --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "Site preview: $URL" >> "$GITHUB_STEP_SUMMARY"

  # The one check to require in branch protection. A job skipped by the
  # path filter counts as passed; a failed or cancelled one fails this.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, validate-import-targets, build, website]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
