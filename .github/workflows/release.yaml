name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write        # Sigstore signing for attestations
  attestations: write    # Upload attestations to GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two published lines per board. Factory artifacts drop the
        # "-factory" suffix (gbbdongle.factory.bin etc.) so update manifests
        # already in the field keep resolving and stay on the factory line;
        # the HA-compatible line gets new "-ha" artifact names.
        config:
          - gbbdongle-factory
          - gbbdongle-ha
          - gbbdongle-tcan485-factory
          - gbbdongle-tcan485-ha
          - gbbdongle-kamami-factory
          - gbbdongle-kamami-ha
          - gbbdongle-8di8do-wifi-factory
          - gbbdongle-8di8do-wifi-ha
          - gbbdongle-8di8do-eth-factory
          - gbbdongle-8di8do-eth-ha
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache PlatformIO and ESPHome build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            firmware/.esphome
          # "=" terminates the config name so restore-keys prefix matching
          # cannot cross variants ("gbbdongle" is a prefix of all the others).
          key: pio-${{ runner.os }}-${{ matrix.config }}=${{ hashFiles('uv.lock', 'firmware/**/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.config }}=

      - name: Compile firmware
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run esphome -s version "$VERSION" -s external_components_source ../components compile "firmware/${{ matrix.config }}.yaml"

      - name: Collect binaries
        run: |
          # The build dir is named after the device name (the import
          # target's device_name), which both lines share; the artifact
          # basename keeps legacy names for -factory and adds -ha otherwise.
          CONFIG="${{ matrix.config }}"
          BASE="${CONFIG%-factory}"
          BASE="${BASE%-ha}"
          BUILD_DIR="firmware/.esphome/build/${BASE}/build"
          case "$CONFIG" in
            *-factory) OUT="$BASE" ;;
            *-ha)      OUT="${BASE}-ha" ;;
          esac
          mkdir -p dist
          cp "$BUILD_DIR/firmware.factory.bin" "dist/${OUT}.factory.bin"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${OUT}.ota.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.config }}
          path: dist/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the release-notes step can diff against
          # the previous release tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: site/firmware

      # ── SBOM: build toolchain ──
      # Scans pyproject.toml / uv.lock (esphome + the whole Python toolchain
      # the firmware is built with). The C components baked into the binary
      # (ESP-IDF, ArduinoJson) are pinned by the esphome version listed here.
      - name: Generate toolchain SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-toolchain.cyclonedx.json

      - name: Rename SBOM for release
        run: cp sbom-toolchain.cyclonedx.json "SBOM-Toolchain-${GITHUB_REF_NAME#v}.cyclonedx.json"

      # ── Attestations ──
      # Sigstore-signed provenance: proves the firmware binaries were built by
      # THIS workflow in THIS repo. Verify with:
      #   gh attestation verify gbbdongle.factory.bin --owner KrzysztofHajdamowicz
      - name: Attest firmware build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: site/firmware/*.bin

      - name: Attest firmware SBOM
        uses: actions/attest@v4.2.2
        with:
          subject-path: site/firmware/*.bin
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom-toolchain.cyclonedx.json

      # ── Release notes ──
      # generate_release_notes below only lists merged PRs, so commits pushed
      # straight to main would be invisible in the changelog. List them here;
      # action-gh-release prepends this body to the auto-generated PR list
      # and "Full Changelog" compare link.
      - name: List direct commits for release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}"
          # --first-parent --no-merges drops PR merge commits (and their branch
          # commits); the grep drops squash-merged PRs, whose subject GitHub
          # suffixes with "(#N)". Both are already covered by the PR list.
          git log --first-parent --no-merges --pretty='* %s (%h)' "$RANGE" \
            | grep -vE '\(#[0-9]+\) \([0-9a-f]+\)$' > commits.txt || true
          : > release-notes.md
          if [ -s commits.txt ]; then
            printf '## Direct commits\n' > release-notes.md
            cat commits.txt >> release-notes.md
          fi

      - name: Attach binaries and SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            site/firmware/*.bin
            SBOM-Toolchain-*.cyclonedx.json

  # Publishes the site with this release's binaries and manifests (the
  # update entities of devices in the field poll them).
  pages:
    needs: assemble
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
    with:
      tag: ${{ github.ref_name }}
