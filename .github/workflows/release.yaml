name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write        # Sigstore signing for attestations + Pages deploy
  attestations: write    # Upload attestations to GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two published lines per board. Factory artifacts drop the
        # "-factory" suffix (gbbdongle.factory.bin etc.) so update manifests
        # already in the field keep resolving and stay on the factory line;
        # the HA-compatible line gets new "-ha" artifact names.
        config:
          - gbbdongle-factory
          - gbbdongle-ha
          - gbbdongle-tcan485-factory
          - gbbdongle-tcan485-ha
          - gbbdongle-kamami-factory
          - gbbdongle-kamami-ha
          - gbbdongle-8di8do-wifi-factory
          - gbbdongle-8di8do-wifi-ha
          - gbbdongle-8di8do-eth-factory
          - gbbdongle-8di8do-eth-ha
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache PlatformIO and ESPHome build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/esphome
            firmware/.esphome
          # "=" terminates the config name so restore-keys prefix matching
          # cannot cross variants ("gbbdongle" is a prefix of all the others).
          key: pio-${{ runner.os }}-${{ matrix.config }}=${{ hashFiles('uv.lock', 'firmware/**/*.yaml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.config }}=

      - name: Compile firmware
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run esphome -s version "$VERSION" compile "firmware/${{ matrix.config }}.yaml"

      - name: Collect binaries
        run: |
          # The build dir is named after the device name (the import
          # target's device_name), which both lines share; the artifact
          # basename keeps legacy names for -factory and adds -ha otherwise.
          CONFIG="${{ matrix.config }}"
          BASE="${CONFIG%-factory}"
          BASE="${BASE%-ha}"
          BUILD_DIR="firmware/.esphome/build/${BASE}/build"
          case "$CONFIG" in
            *-factory) OUT="$BASE" ;;
            *-ha)      OUT="${BASE}-ha" ;;
          esac
          mkdir -p dist
          cp "$BUILD_DIR/firmware.factory.bin" "dist/${OUT}.factory.bin"
          cp "$BUILD_DIR/firmware.ota.bin" "dist/${OUT}.ota.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.config }}
          path: dist/
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so the release-notes step can diff against
          # the previous release tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: site/firmware

      - name: Assemble site and manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          cp -R static/. site/

          # Board table: <config basename> <chipFamily> <manifest suffix> <display name...>
          # Per-board manifests are required because chipFamily alone cannot
          # distinguish the two plain-ESP32 boards (T-CAN485 and Kamami):
          # each install button and each device's update entity points at its
          # own manifest instead.
          BOARDS='
          gbbdongle              ESP32-S3 gbbdongle   Waveshare ESP32-S3-RS485-CAN
          gbbdongle-tcan485      ESP32    tcan485     LilyGo T-CAN485
          gbbdongle-kamami       ESP32    kamami      Kamami KAmod ESP32 ETH+PoE
          gbbdongle-8di8do-wifi  ESP32-S3 8di8do-wifi Waveshare ESP32-S3-POE-ETH-8DI-8DO, WiFi
          gbbdongle-8di8do-eth   ESP32-S3 8di8do-eth  Waveshare ESP32-S3-POE-ETH-8DI-8DO, Ethernet
          '

          # Each board gets four manifests: install + update for the factory
          # line (legacy names, so devices in the field stay on it) and
          # install + update for the HA-compatible line ("-ha" suffix).
          while read -r config chip suffix name; do
            [ -z "$config" ] && continue

            for line in factory ha; do
              if [ "$line" = "factory" ]; then
                bin="$config"; msuffix="$suffix"; display="GbbDongle (${name})"
              else
                bin="${config}-ha"; msuffix="${suffix}-ha"; display="GbbDongle (${name}, Home Assistant)"
              fi
              md5=$(md5sum "site/firmware/${bin}.ota.bin" | cut -d' ' -f1)

              # Per-board ESP Web Tools manifest (browser flashing over USB).
              cat > "site/firmware/manifest-${msuffix}.json" <<EOF
          {
            "name": "${display}",
            "version": "$VERSION",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "${chip}",
                "parts": [{ "path": "${bin}.factory.bin", "offset": 0 }]
              }
            ]
          }
          EOF

              # Per-board manifest for the esphome http_request update entity
              # (OTA); each variant yaml points update_manifest_url at its own.
              cat > "site/firmware/update-manifest-${msuffix}.json" <<EOF
          {
            "name": "${display}",
            "version": "$VERSION",
            "builds": [
              {
                "chipFamily": "${chip}",
                "ota": {
                  "path": "${bin}.ota.bin",
                  "md5": "${md5}",
                  "summary": "GbbDongle $VERSION",
                  "release_url": "${RELEASE_URL}"
                }
              }
            ]
          }
          EOF
            done
          done <<< "$BOARDS"

          # ── Legacy shared manifests ──
          # Kept for devices already in the field (they poll this URL and
          # migrate to their per-board manifest with their next OTA) and for
          # old bookmarks. Deliberately NOT extended with the Kamami board
          # (its chipFamily ESP32 would collide with the T-CAN485 entry) nor
          # the 8DI8DO variants (ESP32-S3 would collide with the Waveshare
          # RS485-CAN entry).
          MD5_S3=$(md5sum site/firmware/gbbdongle.ota.bin | cut -d' ' -f1)
          MD5_TCAN485=$(md5sum site/firmware/gbbdongle-tcan485.ota.bin | cut -d' ' -f1)
          cat > site/firmware/manifest.json <<EOF
          {
            "name": "GbbDongle",
            "version": "$VERSION",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [{ "path": "gbbdongle.factory.bin", "offset": 0 }]
              },
              {
                "chipFamily": "ESP32",
                "parts": [{ "path": "gbbdongle-tcan485.factory.bin", "offset": 0 }]
              }
            ]
          }
          EOF

          cat > site/firmware/update-manifest.json <<EOF
          {
            "name": "GbbDongle",
            "version": "$VERSION",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "ota": {
                  "path": "gbbdongle.ota.bin",
                  "md5": "$MD5_S3",
                  "summary": "GbbDongle $VERSION",
                  "release_url": "${RELEASE_URL}"
                }
              },
              {
                "chipFamily": "ESP32",
                "ota": {
                  "path": "gbbdongle-tcan485.ota.bin",
                  "md5": "$MD5_TCAN485",
                  "summary": "GbbDongle $VERSION",
                  "release_url": "${RELEASE_URL}"
                }
              }
            ]
          }
          EOF

          jq . site/firmware/manifest*.json site/firmware/update-manifest*.json > /dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # ── SBOM: build toolchain ──
      # Scans pyproject.toml / uv.lock (esphome + the whole Python toolchain
      # the firmware is built with). The C components baked into the binary
      # (ESP-IDF, ArduinoJson) are pinned by the esphome version listed here.
      - name: Generate toolchain SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-toolchain.cyclonedx.json

      - name: Rename SBOM for release
        run: cp sbom-toolchain.cyclonedx.json "SBOM-Toolchain-${GITHUB_REF_NAME#v}.cyclonedx.json"

      # ── Attestations ──
      # Sigstore-signed provenance: proves the firmware binaries were built by
      # THIS workflow in THIS repo. Verify with:
      #   gh attestation verify gbbdongle.factory.bin --owner KrzysztofHajdamowicz
      - name: Attest firmware build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: site/firmware/*.bin

      - name: Attest firmware SBOM
        uses: actions/attest@v4.2.0
        with:
          subject-path: site/firmware/*.bin
          predicate-type: https://cyclonedx.org/bom
          predicate-path: sbom-toolchain.cyclonedx.json

      # ── Release notes ──
      # generate_release_notes below only lists merged PRs, so commits pushed
      # straight to main would be invisible in the changelog. List them here;
      # action-gh-release prepends this body to the auto-generated PR list
      # and "Full Changelog" compare link.
      - name: List direct commits for release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+${PREV_TAG}..}${GITHUB_REF_NAME}"
          # --first-parent --no-merges drops PR merge commits (and their branch
          # commits); the grep drops squash-merged PRs, whose subject GitHub
          # suffixes with "(#N)". Both are already covered by the PR list.
          git log --first-parent --no-merges --pretty='* %s (%h)' "$RANGE" \
            | grep -vE '\(#[0-9]+\) \([0-9a-f]+\)$' > commits.txt || true
          : > release-notes.md
          if [ -s commits.txt ]; then
            printf '## Direct commits\n' > release-notes.md
            cat commits.txt >> release-notes.md
          fi

      - name: Attach binaries and SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            site/firmware/*.bin
            SBOM-Toolchain-*.cyclonedx.json

  deploy-pages:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
