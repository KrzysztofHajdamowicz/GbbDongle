name: Pages

# Builds the product site (Hugo, website/) together with the firmware of a
# release (its .bin assets + the manifests generated from them under
# firmware/) and deploys it to GitHub Pages. The deployment replaces the
# whole site, so every run republishes the binaries and manifests that
# devices in the field poll.
#
# - push to main touching the site: rebuild with the latest release
# - release.yaml calls it with the freshly published tag
#
# Pull requests build the same site in ci.yaml (job "website", via the
# shared .github/actions/build-site action) and never deploy.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/faq*.md"
      - "tools/site/**"
      - ".github/actions/build-site/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose firmware to publish (default: latest release)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run still deploys after the current one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # Pages' own base URL (the custom domain); the release's binaries and
      # manifests land under firmware/ at the same paths every deploy.
      - uses: ./.github/actions/build-site
        with:
          base-url: ${{ steps.pages.outputs.base_url }}
          tag: ${{ inputs.tag }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
