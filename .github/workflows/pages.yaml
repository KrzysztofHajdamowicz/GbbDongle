name: Pages

# Builds the product site (Hugo, website/) together with the firmware of a
# release (its .bin assets + the manifests generated from them under
# firmware/) and deploys it to GitHub Pages. The deployment replaces the
# whole site, so every run republishes the binaries and manifests that
# devices in the field poll.
#
# - push to main touching the site: rebuild with the latest release
# - release.yaml calls it with the freshly published tag
#
# Pull requests build the same site in ci.yaml (job "website", via the
# shared .github/actions/build-site action) and never deploy.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/faq*.md"
      - "tools/site/**"
      - ".github/actions/build-site/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose firmware to publish (default: latest release)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run still deploys after the current one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base-url: ${{ steps.pages.outputs.base_url }}
      tag: ${{ steps.site.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # Pages' own base URL (the custom domain); the release's binaries and
      # manifests land under firmware/ at the same paths every deploy.
      - id: site
        uses: ./.github/actions/build-site
        with:
          base-url: ${{ steps.pages.outputs.base_url }}
          tag: ${{ inputs.tag }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # actions/deploy-pages sends GITHUB_SHA as pages_build_version, and Pages
  # keeps serving the existing deployment when it already has one for that
  # build version (a value other than a commit SHA is rejected). So a release
  # tagged on a commit that a push to main had already deployed, with the
  # previous release's firmware, publishes nothing while reporting success.
  # The manifest check below turns that into a failed run; recover by
  # deploying from a newer commit (any push to main touching the site, then
  # this workflow picks the latest release).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Devices poll this manifest: a deploy only counts once the live site
      # offers the release that was built. The query string skips the CDN
      # cache (max-age=600).
      - name: Check the live update manifest
        env:
          BASE_URL: ${{ needs.build.outputs.base-url }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          URL="${BASE_URL}/firmware/update-manifest.json"
          for _ in $(seq 12); do
            LIVE=$(curl -sSf "${URL}?run=${GITHUB_RUN_ID}-${RANDOM}" | jq -r .version || true)
            echo "Live version: ${LIVE:-none}, expected ${TAG#v}"
            [ "$LIVE" = "${TAG#v}" ] && exit 0
            sleep 10
          done
          echo "::error::${URL} does not serve ${TAG}" >&2
          exit 1
